# remap prefix from 'C-b' to 'C-Space'
unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

# reload config file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Don't let anything touch the window *name*: not apps via escape sequences
# (zsh → hostname, claude code → its task title) and not tmux's auto-namer.
# The status bar below derives each label straight from the directory instead,
# so titles are identical regardless of which window is focused.
set-window-option -g allow-rename off       # ignore escape-sequence renames from apps
set-window-option -g automatic-rename off   # don't auto-rename from the running command

# keep the previous 10k lines of window history
set-option -g history-limit 10000

# start window and pane index from 1
set -g base-index 1
setw -g pane-base-index 1

# move window position up if a previous window gets removed
set -g renumber-windows on

# split window using | \ - _
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"

# keep current path
bind c new-window -c "#{pane_current_path}"

bind Space last-window

# resizing
bind -r C-j resize-pane -D 15
bind -r C-k resize-pane -U 15
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# If you're running Neovim inside Tmux within iTerm2, you must enable passthrough for the iTerm2 image protocol to work correctly. Add these lines to your ~/.tmux.conf:
set -g visual-activity off # Optional, helps clear images when switching windows

# Claude Code fixes, see https://code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Enable 24-bit (true) colour so themes render correctly
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# ── Plugins (managed by TPM) ──────────────────────────────────────────
# Run ./install.sh on a new machine, or just launch tmux (auto-installs).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Catppuccin — light "Latte" flavour
set -g @catppuccin_flavor 'latte'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_default_fill 'number'
set -g @catppuccin_window_text ' #{b:pane_current_path}:#{pane_current_command}'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text ' #{b:pane_current_path}:#{pane_current_command}'

# Status line layout
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_session}'

# Auto-install TPM on first launch if it's missing, then install plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialise TPM — keep this line at the very bottom of the file
run '~/.tmux/plugins/tpm/tpm'
